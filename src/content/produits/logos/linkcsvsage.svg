<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240">
  <title>LinkCsvSage — logo vectorisé</title>
  <defs>
    <linearGradient id="violet" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9B7BFF"></stop>
      <stop offset="1" stop-color="#7B47F0"></stop>
    </linearGradient>
  </defs>

  <g id="layer-fond" data-name="01 Fond (squircle)">
