    <path d="M 640,1052 H 312 A 72 72 0 0 1 240,980 V 292 A 72 72 0 0 1 312,220 H 606 L 792,406 V 650" fill="none" stroke="url(#violet)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <g id="layer-coin-plie" data-name="03 Coin plié">
    <title>03 Coin plié</title>
    <path d="M 620,232 L 620,416 L 798,416 Z" fill="url(#violet)" stroke="url(#violet)" stroke-width="22" stroke-linejoin="round"></path>
  </g>

  <g id="layer-texte-csv" data-name="04 Texte CSV">
    <title>04 Texte CSV</title>
