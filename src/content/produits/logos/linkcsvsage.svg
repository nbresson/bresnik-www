    <circle cx="876" cy="403" r="31" fill="url(#violet)"></circle>
    <circle cx="963" cy="403" r="31" fill="url(#violet)"></circle>
    <circle cx="1050" cy="403" r="31" fill="url(#violet)"></circle>
    <circle cx="876" cy="512" r="31" fill="url(#violet)"></circle>
    <circle cx="963" cy="512" r="31" fill="url(#violet)"></circle>
    <circle cx="1050" cy="512" r="31" fill="url(#violet)"></circle>
    <circle cx="876" cy="620" r="31" fill="url(#violet)"></circle>
    <circle cx="963" cy="620" r="31" fill="url(#violet)"></circle>
    <circle cx="1050" cy="620" r="31" fill="url(#violet)"></circle>
  </g>

  <g id="layer-chaine" data-name="07 Maillon de chaîne">
    <title>07 Maillon de chaîne</title>
    <g transform="translate(872,888) rotate(-45) scale(1.2)" fill="none" stroke="url(#violet)" stroke-width="42" stroke-linecap="round">
      <path d="M -25,-49 A 36 36 0 0 0 -61,-85 H -139 A 36 36 0 0 0 -175,-49 V 49 A 36 36 0 0 0 -139,85 H -61 A 36 36 0 0 0 -25,49"></path>
      <path d="M 25,-49 A 36 36 0 0 1 61,-85 H 139 A 36 36 0 0 1 175,-49 V 49 A 36 36 0 0 1 139,85 H 61 A 36 36 0 0 1 25,49"></path>
      <path d="M -62,0 H 62"></path>
