name: CI

on:
  push:
  pull_request:

# Une PR depuis une branche du dépôt déclenche push et pull_request : on ne garde que la dernière exécution par référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier, tester, construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          # Polices téléchargées et images optimisées par Astro.
          path: node_modules/.astro
          key: astro-${{ hashFiles('astro.config.mjs', 'package-lock.json') }}-${{ hashFiles('src/content/**', 'src/assets/**') }}
          restore-keys: |
            astro-${{ hashFiles('astro.config.mjs', 'package-lock.json') }}-
      - run: npm ci
      - run: npm run check
      - run: npm run check:worker
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm run verifier-liens
      - run: npm run verifier-csp
      - run: npm run verifier-seo
