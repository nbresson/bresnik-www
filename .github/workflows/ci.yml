name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    name: Vérifier, tester, construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro/fonts
          key: polices-${{ hashFiles('astro.config.mjs') }}
      - run: npm ci
      - run: npm run check
      - run: npm run check:worker
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm run verifier-liens
      - run: npm run verifier-csp
